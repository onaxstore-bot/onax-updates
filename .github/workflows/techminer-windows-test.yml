name: TechMiner Windows validation
on:
  push:
    branches: [techminer-windows-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Application checks
        run: python app/release_health.py
      - name: Installer and Windows checks
        run: python -m unittest test_build_beta test_beta_setup test_windows_integration -v
